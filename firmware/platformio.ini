; ============================================================================
; ESP32 Power Meter — PlatformIO project configuration
;
; Board   : generic ESP32 devkit (esp32dev)
; Build   : pio run
; Flash   : pio run -t upload
; Monitor : pio device monitor   (115200 baud)
;
; Arduino IDE users: you don't need this file. Open src/main.cpp as a sketch
; and install the three libraries listed under lib_deps via the Library
; Manager (see README.md for the exact names).
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor / flashing speeds
monitor_speed = 115200
upload_speed = 921600

; WiFiManager's captive portal makes this a big binary: on the stock 1.2 MB app
; partition it lands at 89% full, leaving almost no room to add anything. This
; project stores everything in NVS and never touches SPIFFS, so trade that
; unused filesystem for app space — 1.9 MB, ~59% used, OTA partition intact.
board_build.partitions = min_spiffs.csv

; Libraries. NOTE: the Arduino Library Manager name differs from the PlatformIO
; registry name for the PZEM library — it is "PZEM004Tv30" there, not
; "PZEM-004T-v30". See README.md.
;   - WiFiManager     by tzapu
;   - PZEM004Tv30     by Jakub Mandula
;   - ArduinoJson     by Benoit Blanchon
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    bblanchon/ArduinoJson @ ^7

; ---------------------------------------------------------------------------
; ESP32-C3. Same source, different pins — the firmware switches automatically
; on CONFIG_IDF_TARGET_ESP32C3. Build with:  pio run -e esp32c3
;
; The C3 is not a smaller ESP32: it has only two UARTs (no Serial2 at all) and
; only 22 GPIOs (so GPIO25 and GPIO13 do not exist). See README.md.
; ---------------------------------------------------------------------------
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    bblanchon/ArduinoJson @ ^7
