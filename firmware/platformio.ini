; ============================================================================
; ESP32 Power Meter — PlatformIO project configuration
;
; Board   : generic ESP32 devkit (esp32dev)
; Build   : pio run
; Flash   : pio run -t upload
; Monitor : pio device monitor   (115200 baud)
;
; Arduino IDE users: you don't need this file. Open src/main.cpp as a sketch
; and install the three libraries listed under lib_deps via the Library
; Manager (see README.md for the exact names).
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor / flashing speeds
monitor_speed = 115200
upload_speed = 921600

; Libraries (Library Manager names for Arduino IDE users):
;   - WiFiManager     by tzapu
;   - PZEM-004T-v30   by Jakub Mandula
;   - ArduinoJson     by Benoit Blanchon
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    bblanchon/ArduinoJson @ ^7
